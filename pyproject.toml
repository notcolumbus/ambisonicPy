[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ambisonicPy"
version = "0.1.0"
description = "A Python Framework for ambisonic/spatial audio development"
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE"}

authors = [
    {name = "Aman Anwar", email = "aman.anwar18oct@gmail.com"}
]

dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "soundfile>=0.11.0",
    "spaudiopy>=0.0.13",
    "requests",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]
melody = [
    "librosa>=0.10.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/ambisonicPy"
Repository = "https://github.com/yourusername/ambisonicPy"
Issues = "https://github.com/yourusername/ambisonicPy/issues"

[tool.setuptools]
packages = ["ambisonicPy"]

[tool.setuptools.package-data]
ambisonicPy = ["*.sofa"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
